name: Contract spec-drift check

on:
  pull_request:
    paths:
      - 'lifebank-soroban/**'
  push:
    branches: [refactor, main]
    paths:
      - 'lifebank-soroban/**'

jobs:
  spec-drift:
    name: Build WASMs and detect interface drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32v1-none target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lifebank-soroban/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('lifebank-soroban/Cargo.lock') }}

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli --version "^22" 2>/dev/null || true

      - name: Build all contract WASMs
        working-directory: lifebank-soroban
        run: bash scripts/build-all.sh

      - name: Extract contract specs
        working-directory: lifebank-soroban
        run: |
          mkdir -p spec-snapshots-new
          for name in \
            analytics_contract coordinator_contract delivery_contract identity_contract \
            inventory_contract matching_contract payment_contract reputation_contract \
            request_contract temperature_contract; do
            wasm="target/wasm32v1-none/release/${name}.wasm"
            if [ -f "$wasm" ]; then
              stellar contract inspect --wasm "$wasm" --output json \
                > "spec-snapshots-new/${name}.json" 2>/dev/null || \
              echo '{"error":"stellar-cli not available"}' \
                > "spec-snapshots-new/${name}.json"
            fi
          done

      - name: Diff against committed snapshots
        working-directory: lifebank-soroban
        run: |
          drift=0
          for f in spec-snapshots-new/*.json; do
            name=$(basename "$f")
            committed="spec-snapshots/$name"
            if [ ! -f "$committed" ]; then
              echo "⚠️  New snapshot (no baseline): $name — commit it with scripts/update-snapshots.sh"
              drift=1
              continue
            fi
            if ! diff -q "$committed" "$f" >/dev/null 2>&1; then
              echo "❌ Interface drift detected in $name:"
              diff "$committed" "$f" || true
              drift=1
            fi
          done
          if [ "$drift" -eq 1 ]; then
            echo ""
            echo "Interface changed without updating the spec snapshot."
            echo "Run  scripts/update-snapshots.sh  locally, review the diff,"
            echo "and include the updated snapshot file in your PR."
            echo ""
            echo "If this is an intentional breaking change, ensure:"
            echo "  - No existing enum variants were removed or reordered (see docs/interfaces/ENUM_POLICY.md)"
            echo "  - The schema version is bumped and migrate() is updated (#31)"
            echo "  - Cross-contract callers are updated to handle the new interface"
            exit 1
          fi
          echo "✅ No interface drift detected."

      - name: Upload new snapshots as artifact (for updating baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-spec-snapshots
          path: lifebank-soroban/spec-snapshots-new/
